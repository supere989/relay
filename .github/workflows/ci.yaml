name: CI

on:
  # Triggers when a PR is merged into main or a direct push occurs
  push:
    branches: [ "main" ]
    
  # Review the maintained Alma branch as well as the default branch.
  pull_request:
    branches: [ "main", "el10-support" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# Newest push wins: Prevents multiple runs from clashing and wasting runner efforts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  tox:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: isolated chatmaild tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # Checkout pull request HEAD commit instead of merge commit
        # Otherwise `test_deployed_state` will be unhappy.
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: download filtermail
        run: curl -L https://github.com/chatmail/filtermail/releases/download/v0.7.7/filtermail-x86_64 -o /usr/local/bin/filtermail && chmod +x /usr/local/bin/filtermail
      - name: run chatmaild tests 
        working-directory: chatmaild
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y age
          # Synthetic Manager state must be in RAM under /tmp.
          test_tmp=$(mktemp -d /tmp/chatmaild-tests.XXXXXXXX)
          sudo mount -t tmpfs -o "size=2G,nosuid,nodev,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$test_tmp"
          trap 'sudo umount "$test_tmp" && rmdir "$test_tmp"' EXIT
          pipx run tox -- --basetemp="$test_tmp/pytest"

  scripts:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: deploy-chatmail tests 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: initenv 
        run: scripts/initenv.sh

      - name: append venv/bin to PATH
        run: echo venv/bin >>$GITHUB_PATH

      - name: run formatting checks 
        run: cmdeploy fmt -v 

      - name: run deploy-chatmail offline tests 
        run: pytest --pyargs cmdeploy 

  lxc-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: LXC deploy and test
    uses: chatmail/cmlxc/.github/workflows/lxc-test.yml@main
    with:
      cmlxc_version: main
      cmlxc_commands: |
        cmlxc init 
        # single cmdeploy relay test
        cmlxc -v deploy-cmdeploy --source ./repo cm0
        cmlxc -v test-mini cm0
        cmlxc -v test-cmdeploy cm0

        # cross cmdeploy relay test
        cmlxc -v deploy-cmdeploy --source ./repo --ipv4-only cm1
        cmlxc -v test-cmdeploy cm0 cm1

        # cross cmdeploy/madmail relay tests
        cmlxc -v deploy-madmail mad0
        cmlxc -v test-cmdeploy cm0 mad0
        cmlxc -v test-mini cm0 mad0
        cmlxc -v test-mini mad0 cm0

